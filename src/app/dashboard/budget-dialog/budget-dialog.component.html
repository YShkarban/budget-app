<mat-card>
  <mat-card-header>
    <mat-card-title>Add funds</mat-card-title>
  </mat-card-header>
  <mat-card-content class="mt-4">
    <div class="row">
      <div class="col">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Amount</mat-label>
          <input matInput type="number" [(ngModel)]="amount" />
        </mat-form-field>
      </div>
      <div class="col">
        <mat-button-toggle-group
          [(ngModel)]="person"
          name="fontStyle"
          aria-label="Font Style"
        >
          @for (item of financeService.partnersArray(); track $index) {
          <mat-button-toggle value="{{ item.name }}">{{
            item.name
          }}</mat-button-toggle>
          }
        </mat-button-toggle-group>
      </div>
    </div>
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Description</mat-label>
      <input matInput type="text" [(ngModel)]="description" />
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="send()">Send</button>
  </mat-card-actions>
</mat-card>
